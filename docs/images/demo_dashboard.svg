<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Synthetic process-mining demonstration</title>
<desc id="desc">Synthetic outputs for trace variant count, transition entropy, rework rate, and AI-assistant event share.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Synthetic process-mining demonstration</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Illustrative outputs from bundled synthetic event logs</text>
<g font-family="Arial">
<rect x="60" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="230" font-size="19" fill="#475569">Trace variants</text><text x="90" y="320" font-size="64" font-weight="700" fill="#0f172a">4</text>
<rect x="340" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="370" y="230" font-size="19" fill="#475569">Transition entropy</text><text x="370" y="320" font-size="58" font-weight="700" fill="#0f172a">0.737</text>
<rect x="620" y="180" width="250" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="650" y="230" font-size="19" fill="#475569">Rework rate</text><text x="650" y="320" font-size="58" font-weight="700" fill="#0f172a">0.129</text>
<rect x="900" y="180" width="240" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="930" y="230" font-size="19" fill="#475569">AI-event share</text><text x="930" y="320" font-size="58" font-weight="700" fill="#0f172a">0.295</text>
</g>
<rect x="150" y="470" width="900" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Synthetic demonstration only</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">These values demonstrate the software path; they are not evidence about real design teams.</text>
</svg>