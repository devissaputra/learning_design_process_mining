<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Learning Design Process Mining pipeline</title>
<desc id="desc">Synthetic instructional-design event logs are converted into traces, transitions, variants, transition entropy, rework, and AI-assistant event summaries.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Learning Design Process Mining · implemented pipeline</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Descriptive process analytics on synthetic design traces</text>
<g font-family="Arial" text-anchor="middle">
<rect x="45" y="220" width="190" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="140" y="270" font-size="20" font-weight="700" fill="#1e3a8a">1. Event log</text><text x="140" y="310" font-size="18" fill="#334155">case · time · stage</text><text x="140" y="338" font-size="18" fill="#334155">actor</text>
<rect x="280" y="220" width="190" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="375" y="270" font-size="20" font-weight="700" fill="#166534">2. Traces</text><text x="375" y="310" font-size="18" fill="#334155">ordered stages</text>
<rect x="515" y="220" width="190" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="610" y="270" font-size="20" font-weight="700" fill="#155e75">3. Transitions</text><text x="610" y="310" font-size="18" fill="#334155">counts + shares</text>
<rect x="750" y="220" width="190" height="150" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="845" y="270" font-size="20" font-weight="700" fill="#9a3412">4. Variants</text><text x="845" y="305" font-size="18" fill="#334155">variant count</text><text x="845" y="333" font-size="18" fill="#334155">transition entropy</text>
<rect x="985" y="220" width="170" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="1070" y="270" font-size="20" font-weight="700" fill="#6b21a8">5. Summary</text><text x="1070" y="305" font-size="18" fill="#334155">rework rate</text><text x="1070" y="333" font-size="18" fill="#334155">AI-event share</text>
</g>
<g stroke="#64748b" stroke-width="4"><path d="M235 295H280"/><path d="M470 295H515"/><path d="M705 295H750"/><path d="M940 295H985"/></g>
<rect x="155" y="455" width="890" height="120" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="498" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Interpretation boundary</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">The baseline describes process structure; it does not infer design quality, causal AI effects, or stage-duration bottlenecks.</text>
</svg>