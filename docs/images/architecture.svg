<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Learning Design Process Mining architecture</title>
<desc id="desc">Synthetic instructional-design event logs are ordered into case traces and summarized with trace variants, transitions, transition entropy, rework rate, and AI-assistant event share.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Learning Design Process Mining · implemented architecture</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Descriptive process analytics on synthetic design-event logs</text>
<g font-family="Arial" text-anchor="middle">
<rect x="55" y="215" width="210" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="160" y="265" font-size="21" font-weight="700" fill="#1e3a8a">Event log</text><text x="160" y="305" font-size="18" fill="#334155">case · time · stage</text>
<rect x="320" y="215" width="210" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="425" y="265" font-size="21" font-weight="700" fill="#166534">Case traces</text><text x="425" y="305" font-size="18" fill="#334155">ordered stages</text>
<rect x="585" y="215" width="250" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="710" y="250" font-size="21" font-weight="700" fill="#155e75">Descriptive metrics</text><text x="710" y="292" font-size="17" fill="#334155">variants · transitions</text><text x="710" y="320" font-size="17" fill="#334155">entropy · rework</text>
<rect x="890" y="215" width="250" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="1015" y="250" font-size="21" font-weight="700" fill="#6b21a8">Research summary</text><text x="1015" y="292" font-size="17" fill="#334155">trace patterns</text><text x="1015" y="320" font-size="17" fill="#334155">AI-event share</text>
</g>
<g stroke="#64748b" stroke-width="4"><path d="M265 290H320"/><path d="M530 290H585"/><path d="M835 290H890"/></g>
<rect x="155" y="455" width="890" height="120" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Interpretation boundary</text>
<text x="600" y="538" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">The current baseline describes process traces; it does not estimate bottleneck duration or causal process effects.</text>
</svg>